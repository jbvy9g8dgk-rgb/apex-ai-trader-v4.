name: Apex V4 AI Trading Bot

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: apex-v4-paper-trading
  cancel-in-progress: false

jobs:
  market-scan:
    name: Apex V4 Market Intelligence
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download Apex V4
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore trading memory
        uses: actions/cache/restore@v4
        with:
          path: paper_state.json
          key: apex-v4-paper-${{ github.run_id }}
          restore-keys: |
            apex-v4-paper-

      - name: Run Apex V4 Intelligence
        run: |
          python main.py

      - name: Save trading memory
        if: success()
        uses: actions/cache/save@v4
        with:
          path: paper_state.json
          key: apex-v4-paper-${{ github.run_id }}

      - name: Upload mobile dashboard
        uses: actions/upload-artifact@v4
        with:
          name: apex-v4-dashboard
          path: docs/
          if-no-files-found: error
          retention-days: 30

      - name: Upload trading records
        uses: actions/upload-artifact@v4
        with:
          name: apex-v4-trading-state
          path: paper_state.json
          if-no-files-found: warn
          retention-days: 30

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages website
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  deploy:
    name: Deploy Apex V4 App
    needs: market-scan
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
